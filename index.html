<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Años de Nahiara - Comparte tus recuerdos</title>
    <!-- Importar tipografías elegantes de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-principal: #e8b4bc;
            --rosa-oscuro: #c78c96;
            --dorado: #d4af37;
            --dorado-claro: #f3e5ab;
            --texto-oscuro: #4a4a4a;
            --blanco-suave: #fcf9f9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--texto-oscuro);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--blanco-suave);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(199, 140, 150, 0.25);
            border: 2px solid var(--dorado-claro);
            box-sizing: border-box;
            text-align: center;
        }

        /* Contenedor de la foto de bienvenida con marco dorado */
        .foto-bienvenida-wrapper {
            margin: 0 auto 20px auto;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, var(--dorado), var(--dorado-claro), var(--dorado));
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.3);
        }

        .foto-bienvenida {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #88424e;
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .subtitulo-xv {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--dorado);
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p.bienvenida-texto {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: #88424e;
            display: block;
            margin-bottom: 5px;
            margin-left: 3px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0c2c7;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--dorado);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        /* Ocultar el input file real */
        #archivoFoto {
            display: none;
        }

        /* Contenedor de los dos botones de foto */
        .botones-foto-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-opcion {
            flex: 1;
            background: white;
            color: #88424e;
            border: 2px solid var(--rosa-oscuro);
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(199, 140, 150, 0.15);
        }

        .btn-opcion:hover {
            background: #fdf2f4;
            transform: translateY(-1px);
        }

        .btn-opcion span {
            font-size: 18px;
        }

        /* Indicador de archivo seleccionado */
        #nombreArchivoSeleccionado {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
            text-align: center;
            word-break: break-all;
        }

        /* Botón Principal de Subir */
        .btn-subir {
            background: linear-gradient(135deg, #c78c96 0%, #a66370 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 12px rgba(199, 140, 150, 0.4);
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-subir:hover {
            background: linear-gradient(135deg, #b57a84 0%, #94535e 100%);
            box-shadow: 0 6px 15px rgba(199, 140, 150, 0.6);
            transform: translateY(-1px);
        }

        #mensaje {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #2e7d32;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Foto de la Quinceañera con diseño circular elegante -->
    <div class="foto-bienvenida-wrapper">
        <img src="15anos.jpg" alt="Nahiara XV" class="foto-bienvenida">
    </div>

    <h1>Nahiara</h1>
    <div class="subtitulo-xv">Mis XV Años</div>
    
    <p class="bienvenida-texto">
        Mi vida se ilumina con los momentos compartidos, y este día tan especial no sería lo mismo sin ti. Gracias por estar aquí para celebrar y ser parte fundamental de mi historia.
    </p>
    
    <div class="form-group">
        <label for="nombreInvitado">Tu Nombre:</label>
        <input type="text" id="nombreInvitado" placeholder="Ej. Familia Pérez / Juan">
    </div>

    <div class="form-group">
        <label for="dedicatoria">Dedicatoria para Nahiara:</label>
        <input type="text" id="dedicatoria" placeholder="Escribe un mensaje bonito...">
    </div>

    <div class="form-group">
        <label>Elige una opción para tu foto:</label>
        
        <!-- Input file oculto pero funcional -->
        <input type="file" id="archivoFoto" accept="image/*">

        <!-- Dos botones separados para evitar confusiones -->
        <div class="botones-foto-container">
            <button type="button" class="btn-opcion" onclick="abrirGaleria()">
                <span>🖼️</span> Galería
            </button>
            <button type="button" class="btn-opcion" onclick="abrirCamara()">
                <span>📷</span> Tomar Foto
            </button>
        </div>
        
        <!-- Texto dinámico para que sepan qué foto eligieron -->
        <div id="nombreArchivoSeleccionado">Ninguna foto seleccionada</div>
    </div>
    
    <button class="btn-subir" onclick="subirFoto()">Guardar y Subir Foto</button>
    
    <p id="mensaje"></p>
</div>

<!-- Importar Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCnrus_x85yxyaNi1U2qm4w8ooDoI4Uc07c",
        authDomain: "xv-anos-fotos-o-fiestaxv.firebaseapp.com",
        projectId: "xv-anos-fotos-o-fiestaxv",
        storageBucket: "xv-anos-fotos-o-fiestaxv.firebasestorage.app",
        messagingSenderId: "667597372916",
        appId: "1:667597372916:web:a286f2e982ada5ad67cda1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const archivoInput = document.getElementById('archivoFoto');
    const textoSeleccionado = document.getElementById('nombreArchivoSeleccionado');

    // Funciones globales para los botones personalizados
    window.abrirGaleria = function() {
        archivoInput.removeAttribute('capture'); // Abre galería directamente en la mayoría de móviles
        archivoInput.click();
    }

    window.abrirCamara = function() {
        archivoInput.setAttribute('capture', 'environment'); // Abre la cámara trasera directo
        archivoInput.click();
    }

    // Mostrar el nombre del archivo cuando el usuario seleccione o tome la foto
    archivoInput.addEventListener('change', function() {
        if (archivoInput.files.length > 0) {
            textoSeleccionado.style.color = "#88424e";
            textoSeleccionado.innerText = "✓ Foto lista: " + archivoInput.files[0].name;
        } else {
            textoSeleccionado.style.color = "#666";
            textoSeleccionado.innerText = "Ninguna foto seleccionada";
        }
    });

    window.subirFoto = async function() {
        const nombre = document.getElementById('nombreInvitado').value.trim() || "Anónimo";
        const dedicatoria = document.getElementById('dedicatoria').value.trim() || "";
        const mensaje = document.getElementById('mensaje');

        if (archivoInput.files.length === 0) {
            alert('Por favor selecciona una foto de tu galería o toma una con la cámara.');
            return;
        }

        const archivo = archivoInput.files[0];
        mensaje.style.color = "#88424e";
        mensaje.innerText = "Preparando imagen...";

        // Función para comprimir manteniendo excelente calidad visual
        const comprimirImagen = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let ancho = img.width;
                        let alto = img.height;
                        
                        const maxAncho = 1280;
                        if (ancho > maxAncho) {
                            alto = Math.round((alto * maxAncho) / ancho);
                            ancho = maxAncho;
                        }

                        canvas.width = ancho;
                        canvas.height = alto;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, ancho, alto);

                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                };
            });
        };

        try {
            mensaje.innerText = "Optimizando foto...";
            const imagenOptimizada = await comprimirImagen(archivo);

            mensaje.innerText = "Subiendo al sistema...";
            await addDoc(collection(db, "fotos_evento"), {
                nombre: nombre,
                dedicatoria: dedicatoria,
                imagenBase64: imagenOptimizada,
                fecha: serverTimestamp()
            });

            mensaje.style.color = "#2e7d32";
            mensaje.innerText = "¡Foto subida con éxito! Gracias por compartir.";
            document.getElementById('nombreInvitado').value = '';
            document.getElementById('dedicatoria').value = '';
            archivoInput.value = '';
            textoSeleccionado.style.color = "#666";
            textoSeleccionado.innerText = "Ninguna foto seleccionada";
        } catch (error) {
            console.error("Error al subir:", error);
            mensaje.style.color = "#d81b60";
            mensaje.innerText = "Hubo un error al subir la foto. Inténtalo de nuevo.";
        }
    }
</script>

</body>
</html>
