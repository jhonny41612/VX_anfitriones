<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - XV de Nahiara</title>
    <!-- Configuración para PWA (Instalar como App Nativa) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c78c96">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-principal: #e8b4bc;
            --rosa-oscuro: #c78c96;
            --dorado: #d4af37;
            --dorado-claro: #f3e5ab;
            --texto-oscuro: #4a4a4a;
            --blanco-suave: #fcf9f9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            margin: 0;
            padding: 20px;
            color: var(--texto-oscuro);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #88424e;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitulo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--dorado);
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Barra de acciones masivas */
        .panel-acciones-masivas {
            background: var(--blanco-suave);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(199, 140, 150, 0.2);
            border: 1px solid var(--dorado-claro);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .btn-masivo {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-seleccionar-todos {
            background: #f0f0f0;
            color: #4a4a4a;
            border: 1px solid #ccc;
        }

        .btn-descargar-todo {
            background: linear-gradient(135deg, #c78c96 0%, #a66370 100%);
            color: white;
        }

        .btn-borrar-todo {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        #cargando {
            font-size: 16px;
            color: #88424e;
            font-weight: 500;
            margin-top: 20px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 10px;
            padding-bottom: 40px;
        }

        .tarjeta-foto {
            background: var(--blanco-suave);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(199, 140, 150, 0.2);
            border: 1px solid var(--dorado-claro);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Checkbox de selección para cada tarjeta */
        .checkbox-seleccion {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--rosa-oscuro);
            z-index: 10;
        }

        .tarjeta-foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 2px solid var(--dorado-claro);
        }

        .info-contenido {
            padding: 15px;
        }

        .nombre-invitado {
            font-weight: 600;
            color: #88424e;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .dedicatoria-texto {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        .botones-contenedor {
            display: flex;
            gap: 10px;
        }

        .btn-accion {
            flex: 1;
            display: block;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-descargar {
            background: linear-gradient(135deg, #c78c96 0%, #a66370 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(199, 140, 150, 0.3);
        }

        .btn-eliminar {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Administración</h1>
    <div class="subtitulo">Recuerdos de los XV Años de Nahiara</div>
    
    <!-- Botones de Control Masivo -->
    <div class="panel-acciones-masivas" id="panelMasivo" style="display: none;">
        <button class="btn-masivo btn-seleccionar-todos" onclick="toggleSeleccionarTodos()">☑️ Seleccionar Todos</button>
        <button class="btn-masivo btn-descargar-todo" onclick="descargarSeleccionadas()">📥 Descargar Seleccionadas</button>
        <button class="btn-masivo btn-borrar-todo" onclick="eliminarSeleccionadas()">🗑️ Borrar Seleccionadas</button>
    </div>

    <div id="cargando">Cargando fotos en tiempo real...</div>
    
    <div class="galeria" id="contenedorGaleria"></div>
</div>

<!-- Importar Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCnrus_x85yxyaNi1U2qm4w8ooDoI4Uc07c",
        authDomain: "xv-anos-fotos-o-fiestaxv.firebaseapp.com",
        projectId: "xv-anos-fotos-o-fiestaxv",
        storageBucket: "xv-anos-fotos-o-fiestaxv.firebasestorage.app",
        messagingSenderId: "667597372916",
        appId: "1:667597372916:web:a286f2e982ada5ad67cda1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listaDocumentos = [];

    async function cargarFotos() {
        const contenedor = document.getElementById('contenedorGaleria');
        const cargando = document.getElementById('cargando');
        const panelMasivo = document.getElementById('panelMasivo');

        try {
            const q = query(collection(db, "fotos_evento"), orderBy("fecha", "desc"));
            const querySnapshot = await getDocs(q);

            cargando.style.display = 'none';
            contenedor.innerHTML = '';
            listaDocumentos = [];

            if (querySnapshot.empty) {
                panelMasivo.style.display = 'none';
                contenedor.innerHTML = '<p style="grid-column: 1/-1; color: #666;">Aún no hay fotos subidas por los invitados.</p>';
                return;
            }

            panelMasivo.style.display = 'flex';

            querySnapshot.forEach((documento) => {
                const data = documento.data();
                const idDoc = documento.id;
                const nombre = data.nombre || "Anónimo";
                const dedicatoria = data.dedicatoria || "";
                const imagenBase64 = data.imagenBase64;

                listaDocumentos.push({ id: idDoc, nombre, dedicatoria, imagenBase64 });

                let nombreLimpio = nombre.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g, "").trim().replace(/\s+/g, "_");
                let dedicatoriaLimpia = dedicatoria ? dedicatoria.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g, "").trim().replace(/\s+/g, "_") : "";
                
                let nombreArchivo = dedicatoriaLimpia 
                    ? `Foto_de_${nombreLimpio}_-_${dedicatoriaLimpia}.jpg` 
                    : `Foto_de_${nombreLimpio}.jpg`;

                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-foto';
                tarjeta.id = `tarjeta-${idDoc}`;

                tarjeta.innerHTML = `
                    <input type="checkbox" class="checkbox-seleccion" value="${idDoc}" data-nombre="${nombreArchivo}" data-img="${imagenBase64}">
                    <img src="${imagenBase64}" alt="Foto de invitado">
                    <div class="info-contenido">
                        <div class="nombre-invitado">👤 ${nombre}</div>
                        <div class="dedicatoria-texto">"${dedicatoria || 'Sin dedicatoria'}"</div>
                        <div class="botones-contenedor">
                            <a href="${imagenBase64}" download="${nombreArchivo}" class="btn-accion btn-descargar">📥 Descargar</a>
                            <button class="btn-accion btn-eliminar" onclick="eliminarFoto('${idDoc}')">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;

                contenedor.appendChild(tarjeta);
            });

        } catch (error) {
            console.error("Error al cargar las fotos:", error);
            cargando.innerText = "Error al cargar las fotos. Revisa tu conexión.";
        }
    }

    // Funciones globales para control masivo
    let todosSeleccionados = false;
    window.toggleSeleccionarTodos = function() {
        const checkboxes = document.querySelectorAll('.checkbox-seleccion');
        todosSeleccionados = !todosSeleccionados;
        checkboxes.forEach(cb => cb.checked = todosSeleccionados);
    }

    window.descargarSeleccionadas = function() {
        const checkboxes = document.querySelectorAll('.checkbox-seleccion:checked');
        if (checkboxes.length === 0) {
            alert("Por favor selecciona al menos una foto para descargar.");
            return;
        }

        checkboxes.forEach((cb, index) => {
            const url = cb.getAttribute('data-img');
            const nombreArchivo = cb.getAttribute('data-nombre');
            
            // Truco con un pequeño retraso para que el navegador descargue todas sin bloquearlas
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = url;
                a.download = nombreArchivo;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, index * 300);
        });
    }

    window.eliminarSeleccionadas = async function() {
        const checkboxes = document.querySelectorAll('.checkbox-seleccion:checked');
        if (checkboxes.length === 0) {
            alert("Por favor selecciona al menos una foto para eliminar.");
            return;
        }

        if (confirm(`¿Estás seguro de eliminar permanentemente las ${checkboxes.length} fotos seleccionadas?`)) {
            try {
                for (const cb of checkboxes) {
                    const idDoc = cb.value;
                    await deleteDoc(doc(db, "fotos_evento", idDoc));
                    
                    const tarjeta = document.getElementById(`tarjeta-${idDoc}`);
                    if (tarjeta) tarjeta.remove();
                }

                const contenedor = document.getElementById('contenedorGaleria');
                if (contenedor.children.length === 0) {
                    document.getElementById('panelMasivo').style.display = 'none';
                    contenedor.innerHTML = '<p style="grid-column: 1/-1; color: #666;">Aún no hay fotos subidas por los invitados.</p>';
                }

                alert("Fotos eliminadas correctamente.");
            } catch (error) {
                console.error("Error al eliminar las fotos:", error);
                alert("Hubo un error al intentar eliminar algunas fotos.");
            }
        }
    }

    window.eliminarFoto = async function(idDoc) {
        if (confirm("¿Estás seguro de que deseas eliminar esta foto permanentemente?")) {
            try {
                await deleteDoc(doc(db, "fotos_evento", idDoc));
                
                const tarjetaAEliminar = document.getElementById(`tarjeta-${idDoc}`);
                if (tarjetaAEliminar) {
                    tarjetaAEliminar.remove();
                }
                
                const contenedor = document.getElementById('contenedorGaleria');
                if (contenedor.children.length === 0) {
                    document.getElementById('panelMasivo').style.display = 'none';
                    contenedor.innerHTML = '<p style="grid-column: 1/-1; color: #666;">Aún no hay fotos subidas por los invitados.</p>';
                }

                alert("Foto eliminada correctamente.");
            } catch (error) {
                console.error("Error al eliminar la foto:", error);
                alert("Hubo un error al intentar eliminar la foto.");
            }
        }
    }

    cargarFotos();
</script>

</body>
</html>
